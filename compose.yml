name: maplibre-nautical

x-nautical: &nautical
  image: maplibre-nautical
  build:
    context: .
  volumes:
    - ./:/project
    - ${CHARTS_DIR:-./sample_data/ENC_ROOT}:/charts:ro

services:
  # njord's sprite sheets and fonts -> assets/
  fetch_assets:
    <<: *nautical
    command: scripts/fetch_assets.sh

  # S-57 cells (CHARTS_DIR, default sample_data/ENC_ROOT) -> output/charts.mbtiles
  convert_maps:
    <<: *nautical
    command: python3 -m nautical.convert_maps --input /charts --output output ${CONVERT_ARGS:-}

  # Natural Earth -> output/base.mbtiles (optional, drawn where no chart covers)
  convert_basemap:
    <<: *nautical
    command: python3 -m nautical.convert_basemap --output output ${BASEMAP_ARGS:-}

  # styles, sprite sheets (with light sectors), fonts and tileserver-gl config -> output/
  generate_mapstyle:
    <<: *nautical
    command: python3 -m nautical.generate_mapstyle --output output ${STYLE_ARGS:-}

  tileserver:
    image: maptiler/tileserver-gl
    volumes:
      - ./output:/data
    ports:
      - "8080:8080"

  maputnik:
    image: maputnik/editor
    ports:
      - "8888:8888"
